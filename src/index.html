<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="app.title">VaultChecker</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img class="logo" src="../assets/images/logo-dark.png" alt="VaultChecker">
        <button class="nav_toggle" type="button" aria-label="Menu" aria-expanded="false" data-nav-toggle>
            <span></span><span></span><span></span>
        </button>
        <nav class="hero_nav">
            <button class="btn_hero_nav" data-i18n="hero.home" data-target="home"></button>
            <button class="btn_hero_nav" data-i18n="hero.membership" data-target="membership"></button>
            <button class="btn_hero_nav" data-i18n="hero.faq" data-target="faq"></button>
            <button class="btn_hero_nav" data-i18n="hero.contact" data-target="contact"></button>
            <button class="btn_hero_nav" data-lang-toggle>EN</button>
            <button class="btn_hero_nav" label="btn_login" data-app-login data-i18n="hero.login"></button>
            <button class="btn_hero_nav btn_hero_nav_cta" data-app-register data-i18n="hero.register"></button>
        </nav>
    </header>
   <main>
      <div class="section" id="home">
           <div class="presentation">
               <p class="short_summary" data-i18n="main.summary"></p>
               <p class="catchy_words" data-i18n="main.catchy"></p>
               <img class="presentation_image" src="../assets/images/hero.png" alt="VaultChecker">

               <p class="highlighted_feature" data-i18n="main.highlightedfeature"></p>
               <div class="main_btns">
                   <button class="btn_start" data-app-register data-i18n="main.btnstart"></button>
               </div>
           </div>
      </div>
       <div class="section">
       <p class="problem_section_name" data-i18n="problem.section"></p>
       <div class="problems_row">
           <div class="problem_summary">
               <h4 class="problem_subtitle" data-i18n="problem1.subtitle"></h4>
               <p class="problem_description" data-i18n="problem1.description"></p>
               <p class="problem_phrase" data-i18n="problem1.phrase"></p>
               <div class="numbering_problems">
                   <h3 class="random_problem" data-i18n="problem1.numbering.title"></h3>
                   <h1 class="random_problem_summary" data-i18n="problem1.numbering.summary"></h1>
                   <p class="random_problem_description" data-i18n="problem1.numbering.description"></p>
               </div>
           </div>

           <div class="problem_summary">
               <h4 class="problem_subtitle" data-i18n="problem2.subtitle"></h4>
               <p class="problem_description" data-i18n="problem2.description"></p>
               <p class="problem_phrase" data-i18n="problem2.phrase"></p>
               <div class="numbering_problems">
                   <h3 class="random_problem" data-i18n="problem2.numbering.title"></h3>
                   <h1 class="random_problem_summary" data-i18n="problem2.numbering.summary"></h1>
                   <p class="random_problem_description" data-i18n="problem2.numbering.description"></p>
               </div>
           </div>

           <div class="problem_summary">
               <h4 class="problem_subtitle" data-i18n="problem3.subtitle"></h4>
               <p class="problem_description" data-i18n="problem3.description"></p>
               <p class="problem_phrase" data-i18n="problem3.phrase"></p>
               <div class="numbering_problems">
                   <h3 class="random_problem" data-i18n="problem3.numbering.title"></h3>
                   <h1 class="random_problem_summary" data-i18n="problem3.numbering.summary"></h1>
                   <p class="random_problem_description" data-i18n="problem3.numbering.description"></p>
               </div>
           </div>
       </div>
       </div>
      <div class="section" id="benefits">
       <div class="benefits">
           <p class="benefits_eyebrow" data-i18n="benefits.eyebrow"></p>
           <h2 class="benefits_title" data-i18n="benefits.title"></h2>
           <p class="benefits_subtitle" data-i18n="benefits.subtitle"></p>
           <div class="benefits_grid">
               <div class="benefit_card">
                   <h3 class="benefit_name" data-i18n="benefits.card1.name"></h3>
                   <p class="benefit_text" data-i18n="benefits.card1.text"></p>
               </div>
               <div class="benefit_card">
                   <h3 class="benefit_name" data-i18n="benefits.card2.name"></h3>
                   <p class="benefit_text" data-i18n="benefits.card2.text"></p>
               </div>
               <div class="benefit_card">
                   <h3 class="benefit_name" data-i18n="benefits.card3.name"></h3>
                   <p class="benefit_text" data-i18n="benefits.card3.text"></p>
               </div>
               <div class="benefit_card">
                   <h3 class="benefit_name" data-i18n="benefits.card4.name"></h3>
                   <p class="benefit_text" data-i18n="benefits.card4.text"></p>
               </div>
               <div class="benefit_card">
                   <h3 class="benefit_name" data-i18n="benefits.card5.name"></h3>
                   <p class="benefit_text" data-i18n="benefits.card5.text"></p>
               </div>
               <div class="benefit_card">
                   <h3 class="benefit_name" data-i18n="benefits.card6.name"></h3>
                   <p class="benefit_text" data-i18n="benefits.card6.text"></p>
               </div>
           </div>
       </div>
      </div>
      <div class="section">
       <div class="about_team">
           <h1 class="about_team_title" data-i18n="team.title"></h1>
           <h3 class="about_team_summary" data-i18n="team.summary"></h3>
           <ul class="team_strengths">
               <li data-i18n="team.strength1"></li>
               <li data-i18n="team.strength2"></li>
               <li data-i18n="team.strength3"></li>
               <li data-i18n="team.strength4"></li>
           </ul>
           <img class="img_about_the_team" src="../assets/images/team.png" alt="VaultChecker">
       </div>
      </div>
       <div class="section" id="membership">
       <div class="membership">
           <p class="membership_eyebrow" data-i18n="membership.eyebrow"></p>
           <h2 class="membership_title" data-i18n="membership.title"></h2>
           <p class="membership_subtitle" data-i18n="membership.subtitle"></p>
           <div class="plans_row">
               <div class="plan_card">
                   <h3 class="plan_name" data-i18n="membership.plan1.name"></h3>
                   <p class="plan_price"><span class="plan_amount" data-i18n="membership.plan1.price"></span><span class="plan_period" data-i18n="membership.plan1.period"></span></p>
                   <p class="plan_desc" data-i18n="membership.plan1.desc"></p>
                   <ul class="plan_features">
                       <li data-i18n="membership.plan1.feature1"></li>
                       <li data-i18n="membership.plan1.feature2"></li>
                       <li data-i18n="membership.plan1.feature3"></li>
                   </ul>
                   <button class="plan_btn" data-app-register data-i18n="membership.plan1.btn"></button>
               </div>

               <div class="plan_card plan_featured">
                   <p class="plan_badge" data-i18n="membership.plan2.badge"></p>
                   <h3 class="plan_name" data-i18n="membership.plan2.name"></h3>
                   <p class="plan_price"><span class="plan_amount" data-i18n="membership.plan2.price"></span><span class="plan_period" data-i18n="membership.plan2.period"></span></p>
                   <p class="plan_desc" data-i18n="membership.plan2.desc"></p>
                   <ul class="plan_features">
                       <li data-i18n="membership.plan2.feature1"></li>
                       <li data-i18n="membership.plan2.feature2"></li>
                       <li data-i18n="membership.plan2.feature3"></li>
                       <li data-i18n="membership.plan2.feature4"></li>
                   </ul>
                   <button class="plan_btn plan_btn_featured" data-app-register data-i18n="membership.plan2.btn"></button>
               </div>

               <div class="plan_card">
                   <h3 class="plan_name" data-i18n="membership.plan3.name"></h3>
                   <p class="plan_price"><span class="plan_amount" data-i18n="membership.plan3.price"></span><span class="plan_period" data-i18n="membership.plan3.period"></span></p>
                   <p class="plan_desc" data-i18n="membership.plan3.desc"></p>
                   <ul class="plan_features">
                       <li data-i18n="membership.plan3.feature1"></li>
                       <li data-i18n="membership.plan3.feature2"></li>
                       <li data-i18n="membership.plan3.feature3"></li>
                       <li data-i18n="membership.plan3.feature4"></li>
                   </ul>
                   <button class="plan_btn" data-app-login data-i18n="membership.plan3.btn"></button>
               </div>
           </div>
       </div>
       </div>
       <div class="section" id="faq">
       <div class="FAQ_section">
           <h1 class="FAQ_title" data-i18n="FAQ.title"></h1>
           <p class="FAQ_description" data-i18n="FAQ.description"></p>
           <div class="FAQ_card">
               <p class="FAQ_question" data-i18n="FAQ.question1"></p>
               <button class="FAQ_show_text">+</button>
               <span class="FAQ_question_shown">
                   <p class="FAQ_answer" data-i18n="FAQ.answer1"></p>
               </span>
           </div>


           <div class="FAQ_card">
               <p class="FAQ_question" data-i18n="FAQ.question2"></p>
               <button class="FAQ_show_text">+</button>
               <span class="FAQ_question_shown">
                   <p class="FAQ_answer" data-i18n="FAQ.answer2"></p>
               </span>
           </div>

           <div class="FAQ_card">
               <p class="FAQ_question" data-i18n="FAQ.question3"></p>
               <button class="FAQ_show_text">+</button>
               <span class="FAQ_question_shown">
                   <p class="FAQ_answer" data-i18n="FAQ.answer3"></p>
               </span>
           </div>

           <div class="FAQ_card">
               <p class="FAQ_question" data-i18n="FAQ.question4"></p>
               <button class="FAQ_show_text">+</button>
               <span class="FAQ_question_shown">
                   <p class="FAQ_answer" data-i18n="FAQ.answer4"></p>
               </span>
           </div>
       </div>
       </div>
   </main>
    <footer id="contact">
        <div class="footer_card">
            <img class="footer_logo" src="../assets/images/logo-dark.png" alt="VaultChecker">
            <p class="footer_info" data-i18n="footer.contact"></p>
            <p class="footer_info" data-i18n="footer.summary"></p>
            <div class="footer_shortcuts">
                <h2 class="footer_explore" data-i18n="footer.explore"></h2>
                <nav class="footer_explore_nav">
                    <button class="btn_home" data-i18n="hero.home" data-target="home"></button>
                    <button class="btn_membership" data-i18n="hero.membership" data-target="membership"></button>
                    <button class="btn_faq" data-i18n="hero.faq" data-target="faq"></button>
                    <button class="btn_contact" data-i18n="hero.contact" data-target="contact"></button>
                </nav>
                <h2 class="footer_next" data-i18n="footer.next"></h2>
                <button class="btn_login" data-app-login data-i18n="hero.login"></button>
            </div>
            <div class="footer_last_division">
                <p class="copyright" data-i18n="footer.copyright"></p>
                <p class="designed_for" data-i18n="footer.designedFor"></p>
            </div>
        </div>
        <script src="script.js"></script>
    </footer>
</body>
</html>
